<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 15%, #15273d 0%, #060b14 100%);
      color: #ffffff;
      position: relative;
    }
    .glow-1 {
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 950px;
      height: 600px;
      background: radial-gradient(circle, rgba(154, 251, 22, 0.18) 0%, rgba(154, 251, 22, 0) 70%);
      pointer-events: none;
    }
    .glow-2 {
      position: absolute;
      bottom: 250px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(56, 189, 248, 0) 70%);
      pointer-events: none;
    }

    /* Top Safe Zone Compliant Banner (starts at 225px) */
    .story-text-banner {
      position: absolute;
      top: 225px;
      left: 45px;
      right: 45px;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 22px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      z-index: 90;
      text-align: center;
    }
    .headline-pill {
      display: inline-block;
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #9afb16;
      background: rgba(154, 251, 22, 0.14);
      border: 1px solid rgba(154, 251, 22, 0.4);
      padding: 6px 18px;
      border-radius: 100px;
      margin-bottom: 10px;
    }
    .main-hook {
      font-size: 32px;
      font-weight: 900;
      line-height: 1.3;
      color: #ffffff;
      margin-bottom: 10px;
    }
    .sub-hook {
      font-size: 21px;
      font-weight: 700;
      line-height: 1.38;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 10px 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .highlight-lime {
      color: #9afb16;
      font-weight: 900;
    }

    /* Larger Smartphone Bezel (Width 620px) */
    .phone-bezel {
      position: absolute;
      top: 465px;
      left: 230px;
      width: 620px;
      height: 990px;
      border-radius: 54px;
      border: 12px solid #1e293b;
      box-shadow: 0 35px 90px rgba(0, 0, 0, 0.95), 0 0 50px rgba(154, 251, 22, 0.2);
      background: transparent;
      z-index: 10;
      pointer-events: none;
    }
    .dynamic-island {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 30px;
      background: #000000;
      border-radius: 20px;
      z-index: 20;
    }

    /* Larger Bottom Safe Zone Compliant Poll (Width 660px, bottom: 265px) */
    .poll-container {
      position: absolute;
      bottom: 265px;
      left: 50%;
      transform: translateX(-50%);
      width: 660px;
      background: #ffffff;
      border-radius: 32px;
      padding: 24px 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      z-index: 95;
      text-align: center;
    }
    .poll-question {
      font-size: 29px;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
    }
    .poll-options {
      display: flex;
      gap: 14px;
    }
    .poll-btn-primary {
      flex: 1;
      background: #0f172a;
      color: #9afb16;
      font-size: 22px;
      font-weight: 800;
      padding: 18px 14px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .poll-btn-secondary {
      flex: 1;
      background: #f8fafc;
      color: #0f172a;
      font-size: 22px;
      font-weight: 800;
      padding: 18px 14px;
      border-radius: 18px;
      border: 1.5px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="story-text-banner">
    <div class="headline-pill">The "Tire-Kicker" Filter ⚡</div>
    <div class="main-hook">Stop wasting 20 mins giving rough quotes over the phone to tire-kickers 🚫📞</div>
    <div class="sub-hook">We build instant square-foot pricing calculators that capture <span class="highlight-lime">serious homeowner phone numbers</span> on autopilot ⚡</div>
  </div>
  <div class="phone-bezel">
    <div class="dynamic-island"></div>
  </div>
  <div class="poll-container">
    <div class="poll-question">Want this on your site?</div>
    <div class="poll-options">
      <div class="poll-btn-primary"><span>Yes, send demo</span><span>🔥</span></div>
      <div class="poll-btn-secondary"><span>Show me how</span><span>🚀</span></div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Story 1: The Instant Quote Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 50% 15%, #15273d 0%, #060b14 100%);
      color: #ffffff;
      position: relative;
      user-select: none;
    }

    /* Ambient Glow Effects */
    .glow-1 {
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 850px;
      height: 550px;
      background: radial-gradient(circle, rgba(154, 251, 22, 0.16) 0%, rgba(154, 251, 22, 0) 70%);
      pointer-events: none;
    }
    .glow-2 {
      position: absolute;
      bottom: 250px;
      left: 50%;
      transform: translateX(-50%);
      width: 750px;
      height: 750px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, rgba(56, 189, 248, 0) 70%);
      pointer-events: none;
    }

    /* Instagram Story Header */
    .story-header {
      position: absolute;
      top: 45px;
      left: 45px;
      right: 45px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 100;
    }
    .story-progress {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      overflow: hidden;
    }
    .story-progress-bar {
      width: 100%;
      height: 100%;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }
    .story-profile {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .profile-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #9afb16, #102B4E);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      color: #0b132b;
      border: 2px solid #9afb16;
      box-shadow: 0 0 16px rgba(154, 251, 22, 0.4);
    }
    .profile-name {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.4px;
    }
    .profile-time {
      font-size: 22px;
      color: rgba(255, 255, 255, 0.6);
      margin-left: 8px;
      font-weight: 500;
    }

    /* Text Overlay Banner */
    .story-text-banner {
      position: absolute;
      top: 145px;
      left: 45px;
      right: 45px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      border-radius: 28px;
      padding: 26px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      z-index: 90;
      text-align: center;
    }
    .headline-pill {
      display: inline-block;
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #9afb16;
      background: rgba(154, 251, 22, 0.12);
      border: 1px solid rgba(154, 251, 22, 0.35);
      padding: 6px 18px;
      border-radius: 100px;
      margin-bottom: 14px;
    }
    .main-hook {
      font-size: 32px;
      font-weight: 900;
      line-height: 1.34;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 14px;
    }
    .sub-hook {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.4;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 18px;
      padding: 12px 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .highlight-lime {
      color: #9afb16;
      font-weight: 900;
    }

    /* Smartphone Bezel */
    .phone-wrapper {
      position: absolute;
      top: 485px;
      left: 50%;
      transform: translateX(-50%);
      width: 530px;
      height: 1040px;
      background: #020617;
      border-radius: 54px;
      border: 10px solid #1e293b;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.95), 0 0 45px rgba(154, 251, 22, 0.16);
      overflow: hidden;
      z-index: 50;
    }
    .dynamic-island {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 30px;
      background: #000000;
      border-radius: 20px;
      z-index: 70;
    }
    .phone-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 44px;
      display: block;
    }

    /* Interactive Poll Sticker */
    .poll-container {
      position: absolute;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%);
      width: 580px;
      background: #ffffff;
      border-radius: 32px;
      padding: 24px 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      z-index: 95;
      text-align: center;
    }
    .poll-question {
      font-size: 28px;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: 18px;
    }
    .poll-options {
      display: flex;
      gap: 14px;
    }
    .poll-btn-primary {
      flex: 1;
      background: #0f172a;
      color: #9afb16;
      font-size: 22px;
      font-weight: 800;
      padding: 16px 14px;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .poll-btn-secondary {
      flex: 1;
      background: #f8fafc;
      color: #0f172a;
      font-size: 22px;
      font-weight: 800;
      padding: 16px 14px;
      border-radius: 18px;
      border: 1.5px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <!-- Story Header -->
  <div class="story-header">
    <div class="story-progress">
      <div class="story-progress-bar"></div>
    </div>
    <div class="story-profile">
      <div class="profile-avatar">MD</div>
      <div>
        <span class="profile-name">multiprodigital</span>
        <span class="profile-time">2h</span>
      </div>
    </div>
  </div>

  <!-- Story Text Overlay -->
  <div class="story-text-banner">
    <div class="headline-pill">The "Tire-Kicker" Filter ⚡</div>
    <div class="main-hook">
      Stop wasting 20 mins giving rough quotes over the phone to tire-kickers 🚫📞
    </div>
    <div class="sub-hook">
      We build instant square-foot pricing calculators that capture <span class="highlight-lime">serious homeowner phone numbers</span> on autopilot ⚡
    </div>
  </div>

  <!-- Phone Screen with Video -->
  <div class="phone-wrapper">
    <div class="dynamic-island"></div>
    <video class="phone-video" src="/videos/story_1_clean_recording.mp4" autoplay loop muted playsinline></video>
  </div>

  <!-- Interactive Poll Sticker -->
  <div class="poll-container">
    <div class="poll-question">Want this on your site?</div>
    <div class="poll-options">
      <div class="poll-btn-primary">
        <span>Yes, send demo</span>
        <span>🔥</span>
      </div>
      <div class="poll-btn-secondary">
        <span>Show me how</span>
        <span>🚀</span>
      </div>
    </div>
  </div>
</body>
</html>
